[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spreadsheet-mirror"
version = "0.1.0"
description = "Spreadsheet-to-Web Mirror Engine: clone .xlsx structure into an interactive web mirror"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PabloRipe" }]
dependencies = ["openpyxl>=3.1", "Flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["waitress>=3.0"]

[project.scripts]
spreadsheet-mirror = "spreadsheet_mirror.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
